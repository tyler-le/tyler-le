name: Update profile
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    paths:
      - update_stats.py
      - .github/workflows/update_stats.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_stats.py
        env:
          GH_TOKEN: ${{ github.token }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_TOKEN_2: ${{ secrets.STATS_TOKEN_2 }}
          STATS_TOKEN_3: ${{ secrets.STATS_TOKEN_3 }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dark_mode.svg light_mode.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh terminal profile"
            git push
          fi
